<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d18" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.6" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="subtleBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#8b5cf6" flood-opacity="0.4" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes pulseNode {
        0%, 100% { opacity: 0.3; r: 3; }
        50% { opacity: 0.9; r: 5; }
      }
      @keyframes dataFlow {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes ambientGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      .floating-pill-1 { animation: floatSlow 5s ease-in-out infinite; }
      .floating-pill-2 { animation: floatReverse 6s ease-in-out infinite; }
      .floating-pill-3 { animation: floatSlow 7s ease-in-out infinite 1s; }
      .floating-pill-4 { animation: floatReverse 5.5s ease-in-out infinite 0.5s; }
      .ambient-glow-1 { transform-origin: 250px 120px; animation: ambientGlow 8s ease-in-out infinite alternate; }
      .ambient-glow-2 { transform-origin: 950px 280px; animation: ambientGlow 9s ease-in-out infinite alternate 1s; }
      .data-packet { stroke-dasharray: 12 120; animation: dataFlow 3.5s linear infinite; }
      .data-packet-fast { stroke-dasharray: 8 90; animation: dataFlow 2.2s linear infinite; }
      .pulse-dot-1 { animation: pulseNode 3s infinite ease-in-out; }
      .pulse-dot-2 { animation: pulseNode 2.5s infinite ease-in-out 0.8s; }
      .pulse-dot-3 { animation: pulseNode 3.2s infinite ease-in-out 1.5s; }
    </style>
  </defs>

  <!-- Canvas Background with Border -->
  <rect width="1200" height="400" rx="20" fill="url(#bgGrad)" />
  <rect width="1196" height="396" x="2" y="2" rx="19" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Ambient Light Orbs -->
  <circle class="ambient-glow-1" cx="250" cy="120" r="160" fill="url(#glowGrad1)" filter="url(#subtleBlur)" />
  <circle class="ambient-glow-2" cx="950" cy="280" r="170" fill="url(#glowGrad2)" filter="url(#subtleBlur)" />

  <!-- Animated Background Network / Flow Circuit (Deep Background) -->
  <g opacity="0.25">
    <path d="M 50 80 Q 200 40, 350 120 T 650 90 T 950 140 T 1150 70" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path class="data-packet" d="M 50 80 Q 200 40, 350 120 T 650 90 T 950 140 T 1150 70" fill="none" stroke="#60a5fa" stroke-width="3" />
    
    <path d="M 80 340 Q 300 370, 500 310 T 800 350 T 1120 310" fill="none" stroke="#c084fc" stroke-width="1.5" />
    <path class="data-packet-fast" d="M 80 340 Q 300 370, 500 310 T 800 350 T 1120 310" fill="none" stroke="#f472b6" stroke-width="3" />

    <line x1="200" y1="60" x2="200" y2="340" stroke="#334155" stroke-dasharray="4 6" stroke-width="1" />
    <line x1="600" y1="40" x2="600" y2="360" stroke="#334155" stroke-dasharray="4 6" stroke-width="1" />
    <line x1="1000" y1="50" x2="1000" y2="350" stroke="#334155" stroke-dasharray="4 6" stroke-width="1" />
  </g>

  <!-- Network Circuit Nodes -->
  <circle class="pulse-dot-1" cx="350" cy="120" r="4" fill="#38bdf8" />
  <circle class="pulse-dot-2" cx="650" cy="90" r="4" fill="#a855f7" />
  <circle class="pulse-dot-3" cx="950" cy="140" r="4" fill="#ec4899" />
  <circle class="pulse-dot-2" cx="500" cy="310" r="4" fill="#38bdf8" />
  <circle class="pulse-dot-1" cx="800" cy="350" r="4" fill="#c084fc" />

  <!-- Perimeter Floating Pills (Carefully placed outside the central title area) -->
  <!-- Top Left Pill -->
  <g class="floating-pill-1" transform="translate(60, 42)">
    <rect width="180" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="18" cy="17" r="5" fill="#38bdf8" />
    <text x="32" y="22" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">⚡ TOOL CALLING</text>
  </g>

  <!-- Top Right Pill -->
  <g class="floating-pill-2" transform="translate(950, 42)">
    <rect width="190" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="18" cy="17" r="5" fill="#a855f7" />
    <text x="32" y="22" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">🛡️ AUTH GATEWAYS</text>
  </g>

  <!-- Bottom Left Pill -->
  <g class="floating-pill-4" transform="translate(70, 324)">
    <rect width="210" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#ec4899" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="18" cy="17" r="5" fill="#ec4899" />
    <text x="32" y="22" fill="#fbcfe8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">🔌 MODEL CONTEXT PROTOCOL</text>
  </g>

  <!-- Bottom Right Pill -->
  <g class="floating-pill-3" transform="translate(940, 324)">
    <rect width="190" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#10b981" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="18" cy="17" r="5" fill="#10b981" />
    <text x="32" y="22" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">🤖 FUNCTION EXECUTION</text>
  </g>

  <!-- FOREGROUND TEXT SECTION (High Z-index, perfectly centered, never obscured) -->
  <g id="foreground-text" transform="translate(600, 155)">
    <!-- Category Badge -->
    <rect x="-115" y="-38" width="230" height="28" rx="14" fill="#0f172a" stroke="#6366f1" stroke-width="1.2" />
    <text x="0" y="-20" text-anchor="middle" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">CURATED ECOSYSTEM DIRECTORY</text>

    <!-- Main Title -->
    <text x="0" y="32" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5" fill="url(#textGrad)" filter="url(#dropGlow)">
      Awesome Agentic API Integration Tooling
    </text>

    <!-- Subtitle Line 1 -->
    <text x="0" y="72" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" letter-spacing="0.2">
      The Complete Landscape of SaaS Platforms, MCP Gateways &amp; Open-Source Runtimes
    </text>

    <!-- Subtitle Line 2 -->
    <text x="0" y="100" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Bridging LLM Reasoning with Real-World API Actions, OAuth Boundaries &amp; Multi-Tool Orchestration
    </text>
  </g>
</svg>
